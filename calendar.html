const STORAGE_PREFIX='ip-calendar:v1:',done=new Set(),supplies=new Set();let extra={},names={grade1:'',grade2:''},viewMonth=8;const make=(tag,text)=>{const n=document.createElement(tag);if(text)n.textContent=text;return n;};
function childName(who){return names[who].trim()||(who==='grade1'?'弟弟':'哥哥');}
function profileKey(value=names){return STORAGE_PREFIX+'profile:'+encodeURIComponent((value.grade1.trim()||'弟弟')+'|'+(value.grade2.trim()||'哥哥'));}
function saveState(){try{localStorage.setItem(profileKey(),JSON.stringify({done:[...done],extra,supplies:[...supplies]}));localStorage.setItem(STORAGE_PREFIX+'last-names',JSON.stringify(names));}catch(error){q('#profile-status').textContent='瀏覽器目前無法儲存資料';}}
function loadState(nextNames){names={grade1:(nextNames.grade1||'').trim(),grade2:(nextNames.grade2||'').trim()};done.clear();supplies.clear();extra={};try{const saved=JSON.parse(localStorage.getItem(profileKey())||'{}');for(const key of saved.done||[])done.add(key);for(const key of saved.supplies||[])supplies.add(String(key));if(saved.extra&&typeof saved.extra==='object')extra=saved.extra;localStorage.setItem(STORAGE_PREFIX+'last-names',JSON.stringify(names));}catch(error){}q('#grade1-name').value=names.grade1;q('#grade2-name').value=names.grade2;}
function fill(td,date,who){const html=(database[date]?.[who]||'').replaceAll('弟弟聯絡本','聯絡本').replaceAll('哥哥聯絡本','聯絡本');td.innerHTML=html;for(const li of td.querySelectorAll('li'))if(/登記.*分數/.test(li.textContent))li.remove();if(extra[date+'-'+who]){const h=make('div');h.className='tag-header';h.innerHTML='<span class="tag-pill pill-brother">自訂待辦</span>';td.append(h);const ul=make('ul');for(const text of extra[date+'-'+who])ul.append(make('li',text));td.append(ul);}let i=0;for(const li of td.querySelectorAll('li')){const key=date+'-'+who+'-'+i++,text=li.textContent;if(/No class|No homework|quiz.*tomorrow/i.test(text))continue;li.parentElement.classList.add('checklist');const label=make('label');label.className=done.has(key)?'done':'';const box=make('input');box.type='checkbox';box.checked=done.has(key);box.onchange=()=>{box.checked?done.add(key):done.delete(key);saveState();render();};label.append(box,make('span',text));li.replaceChildren(label);}}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function renderDetail(day){const key=dateKey(day),detail=q('#month-detail');q('#today-title').textContent=`${day.getMonth()+1} 月 ${day.getDate()} 日（星期${'日一二三四五六'[day.getDay()]}）`;detail.replaceChildren();if(database[key]?.shared){const common=make('div');common.innerHTML=database[key].shared;detail.append(common);}const t=make('table');for(const who of ['grade1','grade2']){const tr=make('tr'),th=make('th',childName(who));th.className='who';th.scope='row';const td=make('td');fill(td,key,who);if(!td.textContent.trim())td.textContent='今日無已登錄事項';tr.append(th,td);t.append(tr);}detail.append(t);}
function render(){const month=viewMonth+1,today=new Date(),todayKey=dateKey(today),first=new Date(2026,viewMonth,1,12),offset=(first.getDay()+6)%7,days=new Date(2026,viewMonth+1,0).getDate(),weeks=Math.ceil((offset+days)/7),body=q('#month-body');q('#calendar-title').textContent=`2026 年 ${month} 月 家庭作業與活動月曆`;q('#month-heading').textContent=`2026 / ${month}`;q('#month-select').value=String(viewMonth);q('#month-progress').textContent=`目前已勾選 ${done.size} 項`;q('.todo-add option[value="grade1"]').textContent=childName('grade1');q('.todo-add option[value="grade2"]').textContent=childName('grade2');q('#supply-title').textContent=`🎨 ${childName('grade1')}｜學期間準備物品`;for(const box of root.querySelectorAll('[data-supply]')){box.checked=supplies.has(box.dataset.supply);box.closest('label').classList.toggle('done',box.checked);}body.replaceChildren();for(let week=0;week<weeks;week++){const dates=make('tr');dates.className='dates';dates.append(make('th'));const upper=make('tr');upper.className='upper';const lower=make('tr');lower.className='lower';for(const [row,who,grade] of [[upper,'grade1','一年級'],[lower,'grade2','二年級']]){const h=make('th',childName(who));h.scope='row';h.className='who';h.append(make('br'),make('small',grade));row.append(h);}for(let col=0;col<7;col++){const d=new Date(2026,viewMonth,1-offset+week*7+col,12),key=dateKey(d),outside=d.getMonth()!==viewMonth,heading=make('td',outside?'':String(d.getDate()));if(key===todayKey)heading.className='selected';if(!outside&&database[key]?.shared){const common=make('div');common.innerHTML=database[key].shared;heading.append(common);}dates.append(heading);for(const [row,who] of [[upper,'grade1'],[lower,'grade2']]){const td=make('td');if(key===todayKey)td.className='selected';if(!outside){fill(td,key,who);if(col<5&&!/放假|連假/.test(database[key]?.shared||'')){const uniform=make('div',who==='grade1'?['運動服','運動服','便服','制服','便服'][col]:['體服','便服','便服','制服','體服'][col]);uniform.className='uniform';td.prepend(uniform);}}row.append(td);}}body.append(dates,upper,lower);}renderDetail(today);}
function setupBus(){const isWednesday=new Date().getDay()===3,qInfo=q('#afternoon-info'),qLink=q('#afternoon-link');q('#afternoon-title').textContent=isWednesday?'🏕️ 今日放學接送（學藝營）':'🏫 今日放學接送（安親班）';qInfo.innerHTML=isWednesday?'⏰ 時間：15:49<br>📍 地點：恩美瑞美語, 2986<br>🚌 車號：22-1號車<br>☎ 聯絡：許老師 (0939-222043)':'⏰ 時間：18:12<br>📍 地點：7-11 商城門市, 2386<br>🚌 車號：51-2號車<br>☎ 聯絡：曾老師 (0960-775249)';qLink.href=isWednesday?'https://notification.theomnieyes.com/location/map/KJA-0062-22':'https://notification.theomnieyes.com/location/map/WEGO-051';qLink.textContent=isWednesday?'📍 查看週三放學校車動態':'📍 查看放學校車動態';}
root.addEventListener('click',e=>{if(e.target.matches('[data-supply]')){e.target.checked?supplies.add(e.target.dataset.supply):supplies.delete(e.target.dataset.supply);saveState();e.target.closest('label').classList.toggle('done',e.target.checked);}const act=e.target.closest('[data-act]')?.dataset.act;if(act==='profile'){saveState();const next={grade1:q('#grade1-name').value,grade2:q('#grade2-name').value},hasNamedProfile=Boolean(names.grade1.trim()||names.grade2.trim());let exists=false;try{exists=localStorage.getItem(profileKey(next))!==null;}catch(error){}if(exists)loadState(next);else if(hasNamedProfile){loadState(next);saveState();}else{names={grade1:next.grade1.trim(),grade2:next.grade2.trim()};saveState();}q('#profile-status').textContent=`已載入並儲存 ${childName('grade1')}、${childName('grade2')} 的資料`;render();}if(act==='today'){const panel=q('.details'),today=new Date();if(today.getFullYear()===2026&&[8,9].includes(today.getMonth()))viewMonth=today.getMonth();render();panel.hidden=!panel.hidden;q('.scroll').hidden=!panel.hidden;q('[data-act=today]').textContent=panel.hidden?'📅 只看今天':'📅 返回月曆';}if(act==='add'){const input=q('.todo-add input[type=text]'),date=q('input[type=date]').value,who=q('.todo-add select').value;if(!input.value.trim()||!date)return;const key=date+'-'+who;extra[key]??=[];extra[key].push(input.value.trim());input.value='';saveState();render();}});q('#month-select').onchange=e=>{viewMonth=Number(e.target.value);render();};q('.todo-add input[type=text]').onkeydown=e=>{if(e.key==='Enter')q('[data-act=add]').click();};for(const input of root.querySelectorAll('.profile input'))input.onkeydown=e=>{if(e.key==='Enter')q('[data-act=profile]').click();};let initialNames={grade1:'',grade2:''};try{initialNames=JSON.parse(localStorage.getItem(STORAGE_PREFIX+'last-names'))||initialNames;}catch(error){}loadState(initialNames);setupBus();render();})();
