function render(){q('#month-progress').textContent=`目前已勾選 ${done.size} 項`;const body=q('#month-body');body.replaceChildren();for(let week=0;week<5;week++){const dates=make('tr');dates.className='dates';dates.append(make('th'));const upper=make('tr');upper.className='upper';const lower=make('tr');lower.className='lower';for(const [row,name] of [[upper,'弟弟'],[lower,'哥哥']]){const h=make('th',name);h.scope='row';h.className='who';h.append(make('br'),make('small',name==='弟弟'?'一年級':'二年級'));row.append(h);}for(let col=0;col<7;col++){const d=new Date(2026,7,31+week*7+col,12),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,outside=d.getMonth()===9;const heading=make('td',outside?'':(d.getMonth()===7?'8/31':String(d.getDate())));if(key==='2026-09-10')heading.className='selected';if(!outside&&database[key]?.shared){const common=make('div');common.innerHTML=database[key].shared;heading.append(common);}dates.append(heading);for(const [row,who] of [[upper,'grade1'],[lower,'grade2']]){const td=make('td');if(key==='2026-09-10')td.className='selected';if(!outside){fill(td,key,who);if(col<5&&!/放假/.test(database[key]?.shared||'')){const uniform=make('div',who==='grade1'?['運動服','運動服','便服','制服','便服'][col]:['體服','便服','便服','制服','體服'][col]);uniform.className='uniform';td.prepend(uniform);}}row.append(td);}}body.append(dates,upper,lower);}
const detail=q('#month-detail');detail.replaceChildren();const t=make('table');for(const [who,name] of [['grade1','弟弟'],['grade2','哥哥']]){const tr=make('tr'),th=make('th',name);th.className='who';th.scope='row';const td=make('td');fill(td,'2026-09-10',who);tr.append(th,td);t.append(tr);}detail.append(t);}
function setupBus(){const isWednesday=new Date().getDay()===3,qInfo=q('#afternoon-info'),qLink=q('#afternoon-link');q('#afternoon-title').textContent=isWednesday?'🏕️ 今日放學接送（學藝營）':'🏫 今日放學接送（安親班）';qInfo.innerHTML=isWednesday?'⏰ 時間：15:49<br>📍 地點：恩美瑞美語, 2986<br>🚌 車號：22-1號車<br>☎ 聯絡：許老師 (0939-222043)':'⏰ 時間：18:12<br>📍 地點：7-11 商城門市, 2386<br>🚌 車號：51-2號車<br>☎ 聯絡：曾老師 (0960-775249)';qLink.href=isWednesday?'https://notification.theomnieyes.com/location/map/KJA-0062-22':'https://notification.theomnieyes.com/location/map/WEGO-051';qLink.textContent=isWednesday?'📍 查看週三放學校車動態':'📍 查看放學校車動態';}
root.addEventListener('click',e=>{const act=e.target.closest('[data-act]')?.dataset.act;if(act==='today'){const panel=q('.details');panel.hidden=!panel.hidden;q('.scroll').hidden=!panel.hidden;q('[data-act=today]').textContent=panel.hidden?'📅 只看今天':'📅 返回月曆';}if(act==='add'){const input=q('input[type=text]'),date=q('input[type=date]').value,who=q('select').value;if(!input.value.trim()||!date)return;const key=date+'-'+who;extra[key]??=[];extra[key].push(input.value.trim());input.value='';render();}});q('input[type=text]').onkeydown=e=>{if(e.key==='Enter')q('[data-act=add]').click();};setupBus();render();})();
</script>
</div>
